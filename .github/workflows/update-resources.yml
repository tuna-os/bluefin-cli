name: Update Embedded Resources

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at 00:00 UTC
  workflow_dispatch: # Allow manual trigger
# Least privilege by default: every job in this file starts read-only and
# must widen its own `permissions:` block to do more.
permissions:
  contents: read


jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Update Brewfiles
        env:
          # Lets the updater resolve each upstream branch to a commit SHA
          # through the API rather than falling back to an unpinned fetch.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: just update-resources

      - name: Verify provenance matches the updated tree
        run: go test -run TestProvenance ./internal/install/

      - name: Check for changes
        id: git-check
        run: |
          git status --porcelain
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.git-check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update embedded Brewfiles and wallpaper cask list"
          title: "chore(deps): update embedded Brewfiles and wallpaper cask list"
          body: |
            This is an automated PR to update embedded resources:
            - Brewfiles in `internal/install/resources/brewfiles/` from `projectbluefin/common`
            - Wallpaper cask list in `internal/install/resources/wallpaper-casks.json` from `ublue-os/homebrew-tap`

            Manual update: `just update-resources`
          branch: chore/update-brewfiles
          base: main
          delete-branch: true
