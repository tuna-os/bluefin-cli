name: Automated Release

on:
  push:
    branches: [ main ]

# Serialize releases on main: overlapping runs (two pushes in quick
# succession) race to compute/tag the same next version, and the loser
# fails with "tag vX.Y.Z already exists" (tuna-os/bluefin-cli#78).
# Queue instead of cancelling so every push still gets released.
concurrency:
  group: automated-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Install Semantic Release dependencies
        run: |
          npm install -g semantic-release \
                         @semantic-release/commit-analyzer \
                         @semantic-release/release-notes-generator \
                         @semantic-release/changelog \
                         @semantic-release/git \
                         @semantic-release/github \
                         @semantic-release/exec

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use a PAT if you want to trigger other workflows or if you need to bypass branch protection
          # GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: npx semantic-release
