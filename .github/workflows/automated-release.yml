name: Automated Release

on:
  push:
    branches: [ main ]

# Serialize releases on main: overlapping runs (two pushes in quick
# succession) race to compute/tag the same next version, and the loser
# fails with "tag vX.Y.Z already exists" (tuna-os/bluefin-cli#78).
# Queue instead of cancelling so every push still gets released.
concurrency:
  group: automated-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.27'
          cache: false

      # Install from the committed, integrity-checked lockfile, outside the
      # checkout, with lifecycle scripts disabled. Renovate bumps the lockfile.
      - name: Install Semantic Release dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/release-tools"
          cp tools/release/package.json tools/release/package-lock.json "$RUNNER_TEMP/release-tools/"
          npm ci --ignore-scripts --prefix "$RUNNER_TEMP/release-tools"
          echo "$RUNNER_TEMP/release-tools/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          install-only: true

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use a PAT if you want to trigger other workflows or if you need to bypass branch protection
          # GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
        run: semantic-release
