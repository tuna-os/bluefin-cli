name: Automated Release

on:
  push:
    branches: [ main ]

# Serialize releases on main: overlapping runs (two pushes in quick
# succession) race to compute/tag the same next version, and the loser
# fails with "tag vX.Y.Z already exists" (tuna-os/bluefin-cli#78).
# Queue instead of cancelling so every push still gets released.
concurrency:
  group: automated-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
          cache: true

      - name: Install Semantic Release dependencies
        run: |
          npm install -g semantic-release \
                         @semantic-release/commit-analyzer \
                         @semantic-release/release-notes-generator \
                         @semantic-release/changelog \
                         @semantic-release/git \
                         @semantic-release/github \
                         @semantic-release/exec

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@72f1b462a0b1a00b6b89b5a0a5b0a5b0a5b0a5b0 # v7
        with:
          install-only: true

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use a PAT if you want to trigger other workflows or if you need to bypass branch protection
          # GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
        run: npx semantic-release
