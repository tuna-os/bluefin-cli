name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Superseded runs waste the queue; only the newest per ref matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'
        
    - name: Download dependencies
      run: go mod download

    - name: Build binary for integration tests
      run: go build -o bluefin-cli .

    - name: Run unit tests
      run: go test -tags extra -v -race -coverprofile=coverage.txt -covermode=atomic ./...
      
    - name: Upload coverage
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.txt
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  tui-smoke:
    name: TUI Smoke (tmux)
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Install tmux
      run: sudo apt-get update && sudo apt-get install -y tmux

    - name: Build binary
      run: go build -tags extra -o bluefin-cli-smoke .

    - name: Run smoke suite
      run: ./scripts/tui-smoke.sh ./bluefin-cli-smoke

    - name: Run TUI state suite
      run: ./scripts/tui-state.sh ./bluefin-cli-smoke

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Build binary
      run: go build -tags extra -o bluefin-cli .

    - name: Run integration tests
      run: go test -v ./test/...

  container-test:
    name: Container-based Tests
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Build container
      run: podman build -t bluefin-cli-dev -f Containerfile.dev .

    # The suite under ./test/ execs the built binary from the repo root
    # (`../bluefin-cli`), so it has to be built inside the container before the
    # tests run — the host workspace is bind-mounted in and carries no binary of
    # its own. Building it in a separate host step instead would link against
    # the host toolchain rather than the container's, which is the whole point
    # of this job.
    - name: Run container tests
      run: |
        podman run --rm \
            -v "$(pwd):/workspace:Z" \
            -w /workspace \
            -e HOME=/root \
            bluefin-cli-dev \
            sh -c 'go build -tags extra -o bluefin-cli . && go test -v ./test/...'

  cross-compile:
    name: Cross-compile (all targets)
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Build every release target, both variants
      run: |
        set -e
        for goos in linux darwin windows; do
          for goarch in amd64 arm64; do
            echo "== $goos/$goarch"
            GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 go build ./...
            GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 go build -tags extra ./...
          done
        done

  test-windows:
    name: Run Tests (windows)
    runs-on: windows-2025

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Build binary for integration tests
      run: go build -tags extra -o bluefin-cli.exe .

    - name: Run unit tests
      run: go test -tags extra ./...

  test-macos:
    name: Run Tests (macos)
    runs-on: macos-26

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Build binary for integration tests
      run: go build -tags extra -o bluefin-cli .

    - name: Run unit tests
      run: go test -tags extra ./...

  goreleaser-check:
    name: goreleaser config
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install GoReleaser
      uses: goreleaser/goreleaser-action@v7
      with:
        version: '~> v2'
        install-only: true

    # Deprecation warnings (brews) are accepted; hard config errors fail.
    - name: Check config
      run: |
        out=$(goreleaser check 2>&1) && exit 0
        echo "$out"
        echo "$out" | grep -q "valid, but uses deprecated" && exit 0
        exit 1

  # go.mod/go.sum drift is invisible to every other job here: `go build` and
  # `go test` happily tolerate stale go.sum lines and an unsorted require
  # block. The release job is the only thing that ever ran `go mod tidy`, so
  # drift merged to main silently and then blew up mid-release with
  # "git is in a dirty state" (tuna-os/bluefin-cli, run 31236007618).
  # Gate it here instead, where a red check costs nothing.
  go-mod-tidy:
    name: go.mod tidy
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    # -diff reports what tidying would change and exits non-zero, without
    # writing to the working tree.
    - name: Check go.mod/go.sum are tidy
      run: go mod tidy -diff

  gofmt:
    name: gofmt
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Check formatting
      run: |
        out=$(gofmt -l .)
        if [ -n "$out" ]; then
          echo "gofmt needed on:"; echo "$out"; exit 1
        fi

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'
        
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
