name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Superseded PR pushes waste the queue, so only the newest run per pull request
# matters. Pushes to main are NOT cancelled (tuna-os/bluefin-cli#257): main runs
# are the release gate and each commit needs its own verdict, so evicting an
# in-flight run reports a real failure as "cancelled" and lets it through.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default: every job in this file starts read-only and
# must widen its own `permissions:` block to do more.
permissions:
  contents: read

jobs:
  # bluefin-cli ships two binaries from mutually exclusive build tags: the
  # standard one compiles `!extra`, bluefin-cli-plus compiles `extra`
  # (tuna-os/bluefin-cli#264). Variant is a matrix dimension so each shipped
  # artifact is built and tested as itself. Previously this job built a
  # standard binary and then ran the suite with `-tags extra`, so the
  # integration tests under ./test/ exec'd a standard binary while the
  # in-process cmd package was compiled as extra -- a mix that describes
  # neither released product.
  test:
    name: Run Tests (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            tags: ''
          - variant: extra
            tags: extra

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'
        
    - name: Download dependencies
      run: go mod download

    - name: Build ${{ matrix.variant }} binary for integration tests
      run: go build ${{ matrix.tags && format('-tags {0}', matrix.tags) || '' }} -o bluefin-cli .

    - name: Run unit tests
      run: go test ${{ matrix.tags && format('-tags {0}', matrix.tags) || '' }} -v -race -coverprofile=coverage.txt -covermode=atomic ./...
      
    - name: Upload coverage
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.txt
        flags: ${{ matrix.variant }}
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  tui-smoke:
    name: TUI Smoke (tmux)
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: Install tmux
      run: sudo apt-get update && sudo apt-get install -y tmux

    - name: Build binary
      run: go build -tags extra -o bluefin-cli-smoke .

    - name: Run smoke suite
      run: ./scripts/tui-smoke.sh ./bluefin-cli-smoke

    - name: Run TUI state suite
      run: ./scripts/tui-state.sh ./bluefin-cli-smoke

  # The main-protection ruleset requires a status check named exactly
  # "Run Tests". Turning that job into a standard/extra matrix
  # (tuna-os/bluefin-cli#264) renamed it to "Run Tests (standard)" and
  # "Run Tests (extra)", so the required context would never report again and
  # every pull request -- starting with the one that made the change -- would
  # be unmergeable with "Required status check \"Run Tests\" is expected".
  #
  # This job keeps that name reporting and passes only when every leg of the
  # matrix passed, so the gate keeps its meaning and future changes to the
  # matrix cannot break it. `if: always()` matters: without it a failed matrix
  # skips this job, the required check never reports at all, and a red PR is
  # indistinguishable from one still waiting.
  test-result:
    name: Run Tests
    runs-on: ubuntu-24.04
    needs: test
    if: always()

    steps:
    - name: Report the matrix result
      run: |
        echo "standard/extra test matrix result: ${{ needs.test.result }}"
        if [ "${{ needs.test.result }}" != "success" ]; then
          echo "::error::one or more legs of the Run Tests matrix did not pass"
          exit 1
        fi

  # Same variant matrix as `test`: ./test/ execs the binary at the repo root,
  # so each variant has to be exercised against its own build.
  integration-test:
    name: Integration Tests (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            tags: ''
          - variant: extra
            tags: extra

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: Build ${{ matrix.variant }} binary
      run: go build ${{ matrix.tags && format('-tags {0}', matrix.tags) || '' }} -o bluefin-cli .

    - name: Run integration tests
      run: go test ${{ matrix.tags && format('-tags {0}', matrix.tags) || '' }} -v ./test/...

  container-test:
    name: Container-based Tests
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Build container
      run: podman build -t bluefin-cli-dev -f Containerfile.dev .

    # The suite under ./test/ execs the built binary from the repo root
    # (`../bluefin-cli`), so it has to be built inside the container before the
    # tests run — the host workspace is bind-mounted in and carries no binary of
    # its own. Building it in a separate host step instead would link against
    # the host toolchain rather than the container's, which is the whole point
    # of this job.
    - name: Run container tests
      run: |
        podman run --rm \
            -v "$(pwd):/workspace:Z" \
            -w /workspace \
            -e HOME=/root \
            bluefin-cli-dev \
            sh -c 'go build -tags extra -o bluefin-cli . && go test -v ./test/...'

  cross-compile:
    name: Cross-compile (all targets)
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: Build every release target, both variants
      run: |
        set -e
        for goos in linux darwin windows; do
          for goarch in amd64 arm64; do
            echo "== $goos/$goarch"
            GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 go build ./...
            GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 go build -tags extra ./...
          done
        done

  test-windows:
    name: Run Tests (windows)
    runs-on: windows-2025

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: Build binary for integration tests
      run: go build -tags extra -o bluefin-cli.exe .

    - name: Run unit tests
      run: go test -tags extra ./...

  test-macos:
    name: Run Tests (macos)
    runs-on: macos-26

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: Build binary for integration tests
      run: go build -tags extra -o bluefin-cli .

    - name: Run unit tests
      run: go test -tags extra ./...

  shell-syntax:
    name: Generated init scripts parse
    runs-on: ubuntu-24.04

    # The POSIX, fish, ash and nushell init scripts are only ever executed on a
    # user's machine, so a syntax error in one of them ships silently and costs
    # that user their prompt. Each generated script is parsed here by the shell
    # it targets -- parse only, nothing is sourced or run
    # (tuna-os/bluefin-cli#260).
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: Install shells
      run: |
        sudo apt-get update
        sudo apt-get install -y dash busybox fish
        # Nushell is not packaged in Ubuntu; take the release tarball.
        NU_VERSION=0.108.0
        curl -fsSL -o /tmp/nu.tar.gz \
          "https://github.com/nushell/nushell/releases/download/${NU_VERSION}/nu-${NU_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
        sudo tar -xzf /tmp/nu.tar.gz -C /usr/local/bin --strip-components=1 \
          "nu-${NU_VERSION}-x86_64-unknown-linux-gnu/nu"
        nu --version

    - name: Build binary
      run: go build -o bluefin-cli .

    - name: bash / zsh / ash parse the POSIX script
      run: |
        set -eux
        ./bluefin-cli init bash > /tmp/init-bash.sh
        ./bluefin-cli init ash  > /tmp/init-ash.sh
        bash -n /tmp/init-bash.sh
        dash -n /tmp/init-ash.sh
        busybox ash -n /tmp/init-ash.sh

    - name: fish parses the fish script
      run: |
        set -eux
        ./bluefin-cli init fish > /tmp/init.fish
        fish --no-execute /tmp/init.fish

    - name: nushell parses the nu script
      run: |
        set -eux
        ./bluefin-cli init nu > /tmp/init.nu
        # `nu --ide-check` parses the file and reports diagnostics without
        # running it; a parse error makes it emit a diagnostic line.
        nu --ide-check 100 /tmp/init.nu | tee /tmp/nu-check.txt
        if grep -q '"type": *"diagnostic"' /tmp/nu-check.txt; then
          echo "::error::nushell reported a diagnostic for the generated init script"
          exit 1
        fi

    # A syntax gate nobody has seen fail is not a gate. Each check above is
    # re-run against a deliberately broken script and must reject it; if one
    # of these passes, the corresponding check above proves nothing and the
    # job fails here rather than going quietly green forever.
    - name: The parse checks reject broken input
      run: |
        set -eu
        expect_reject() {
          if "$@" >/dev/null 2>&1; then
            echo "::error::$1 accepted a deliberately broken script — its check above is not a real gate"
            exit 1
          fi
          echo "ok: $1 rejects broken input"
        }

        printf 'if [ 1 -eq 1 ]; then\n'        > /tmp/broken.sh
        printf 'if true\n'                     > /tmp/broken.fish
        printf 'let x = (\n'                   > /tmp/broken.nu

        expect_reject bash -n /tmp/broken.sh
        expect_reject dash -n /tmp/broken.sh
        expect_reject busybox ash -n /tmp/broken.sh
        expect_reject fish --no-execute /tmp/broken.fish

        # nu --ide-check reports parse problems in its output rather than via
        # exit status, so this one is checked the same way the real step is.
        nu --ide-check 100 /tmp/broken.nu > /tmp/nu-broken.txt 2>&1 || true
        if grep -q '"type": *"diagnostic"' /tmp/nu-broken.txt; then
          echo "ok: nu --ide-check reports a diagnostic for broken input"
        else
          echo "::error::nu --ide-check did not flag a deliberately broken script — the nushell check above is not a real gate"
          cat /tmp/nu-broken.txt
          exit 1
        fi

  docs-current:
    name: docs/commands is current
    runs-on: ubuntu-24.04

    # docs/commands is generated from the cobra command tree, and kept drifting
    # out of date because nothing checked it (tuna-os/bluefin-cli#238, #244,
    # #246). It is generated from the extra variant, which is the superset of
    # both command trees.
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: Regenerate and diff
      run: |
        go build -tags extra -o bluefin-cli .
        ./bluefin-cli docs --dest ./docs/commands
        if ! git diff --quiet -- docs/commands; then
          echo "::error::docs/commands is out of date — run 'just gen-docs' and commit the result"
          git diff --stat -- docs/commands
          git diff -- docs/commands
          exit 1
        fi

  goreleaser-check:
    name: goreleaser config
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install GoReleaser
      uses: goreleaser/goreleaser-action@v7
      with:
        version: '~> v2'
        install-only: true

    # Deprecation warnings (brews) are accepted; hard config errors fail.
    - name: Check config
      run: |
        out=$(goreleaser check 2>&1) && exit 0
        echo "$out"
        echo "$out" | grep -q "valid, but uses deprecated" && exit 0
        exit 1

  # go.mod/go.sum drift is invisible to every other job here: `go build` and
  # `go test` happily tolerate stale go.sum lines and an unsorted require
  # block. The release job is the only thing that ever ran `go mod tidy`, so
  # drift merged to main silently and then blew up mid-release with
  # "git is in a dirty state" (tuna-os/bluefin-cli, run 31236007618).
  # Gate it here instead, where a red check costs nothing.
  go-mod-tidy:
    name: go.mod tidy
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    # -diff reports what tidying would change and exits non-zero, without
    # writing to the working tree.
    - name: Check go.mod/go.sum are tidy
      run: go mod tidy -diff

  gofmt:
    name: gofmt
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: Check formatting
      run: |
        out=$(gofmt -l .)
        if [ -n "$out" ]; then
          echo "gofmt needed on:"; echo "$out"; exit 1
        fi

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'
        
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
