# .goreleaser.yaml
# See https://goreleaser.com for full documentation.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: standard
    binary: bluefin-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/tuna-os/bluefin-cli/cmd.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

  - id: plus
    binary: bluefin-cli-plus
    env:
      - CGO_ENABLED=0
    flags:
      - -tags=extra
    ldflags:
      - -s -w -X github.com/tuna-os/bluefin-cli/cmd.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

# One archive per build: the winget/brews/scoops `ids` filters match archive
# IDs, so a combined archive matches neither and fails the publish step.
archives:
  - id: standard
    ids: [standard]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}
  - id: plus
    ids: [plus]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}-plus_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}

# Native Linux packages published as release assets, installable with
# `dnf install <url>` / `dpkg -i` — no repo hosting needed to start.
nfpms:
  - id: packages
    ids: [standard]
    package_name: bluefin-cli
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [deb, rpm]
    maintainer: "TunaOS <noreply@github.com>"
    homepage: "https://github.com/tuna-os/bluefin-cli"
    description: "Bring the Bluefin terminal experience to any machine."
    license: "Apache-2.0"
    bindir: /usr/bin

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .Version }}-snapshot"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  github:
    owner: tuna-os
    name: bluefin-cli
  draft: false
  prerelease: auto
  name_template: "{{.Tag}}"

# Binary formula published to the tuna-os tap on every release.
# Requires the tuna-os/homebrew-tap repo to exist and a HOMEBREW_TAP_TOKEN
# secret (PAT with contents:write on that repo). skip_upload: auto keeps
# prereleases out of the tap.
# NOTE: goreleaser deprecated `brews` in favor of `homebrew_casks`, but casks
# are macOS-only and Linux users are a primary audience — keep the formula.
brews:
  - name: bluefin-cli
    ids:
      - standard
    repository:
      owner: tuna-os
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/tuna-os/bluefin-cli"
    description: "Make your terminal experience awesome — shell config, tool bundles, and theming for any OS"
    license: Apache-2.0
    # Skip until the HOMEBREW_TAP_TOKEN secret is configured, so a missing
    # token can't fail the release.
    skip_upload: '{{ if envOrDefault "HOMEBREW_TAP_TOKEN" "" }}auto{{ else }}true{{ end }}'
    test: |
      assert_match version.to_s, shell_output("#{bin}/bluefin-cli --version")

# Scoop manifest for Windows. Requires the tuna-os/scoop-bucket repo and the
# same-style token secret.
scoops:
  - name: bluefin-cli
    ids:
      - standard
    repository:
      owner: tuna-os
      name: scoop-bucket
      branch: main
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    homepage: "https://github.com/tuna-os/bluefin-cli"
    description: "Make your terminal experience awesome — shell config, tool bundles, and theming for any OS"
    license: Apache-2.0
    # Skip until the SCOOP_BUCKET_TOKEN secret is configured, so a missing
    # token can't fail the release.
    skip_upload: '{{ if envOrDefault "SCOOP_BUCKET_TOKEN" "" }}auto{{ else }}true{{ end }}'

# AUR binary package for Arch users. Requires an AUR_KEY secret (SSH private
# key with publish access to the bluefin-cli-bin AUR package); skips itself
# when the secret is absent so a missing key can't fail the release.
aurs:
  - name: bluefin-cli-bin
    ids:
      - standard
    homepage: "https://github.com/tuna-os/bluefin-cli"
    description: "Make your terminal experience awesome — shell config, tool bundles, and theming for any OS"
    license: Apache-2.0
    maintainers:
      - "TunaOS <noreply@github.com>"
    git_url: "ssh://aur@aur.archlinux.org/bluefin-cli-bin.git"
    private_key: "{{ .Env.AUR_KEY }}"
    skip_upload: '{{ if envOrDefault "AUR_KEY" "" }}auto{{ else }}true{{ end }}'
    commit_author:
      name: tunabot
      email: noreply@github.com

# Temporarily skipped at invocation (--skip=winget in .releaserc.json's
# publishCmd, not here): WINGET_CREATE_GITHUB_TOKEN is present but 403s
# against microsoft/winget-pkgs (expired or wrong scope) as of #181,
# failing the whole Automated Release job even though the GitHub release
# itself succeeds. .github/workflows/winget.yml (workflow_dispatch) can
# re-submit any specific version manually once the token is fixed. Remove
# --skip=winget from .releaserc.json once WINGET_CREATE_GITHUB_TOKEN is
# verified working again — this config block is otherwise unchanged.
winget:
  - name: BluefinCLI
    publisher: Hanthor
    publisher_url: "https://github.com/tuna-os"
    publisher_support_url: "https://github.com/tuna-os/bluefin-cli/issues"
    package_identifier: Hanthor.BluefinCLI
    license: Apache-2.0
    license_url: "https://github.com/tuna-os/bluefin-cli/blob/main/LICENSE"
    copyright: "Copyright 2025 Bluefin CLI contributors"
    short_description: "Modern CLI for managing shell config and dev environment customization on Universal Blue."
    homepage: "https://github.com/tuna-os/bluefin-cli"
    tags:
      - cli
      - shell
      - bluefin
      - universal-blue
    ids:
      - standard
    # Skip until the WINGET_TOKEN secret is configured, so a missing token
    # can't fail the release. Note: WINGET_TOKEN must be a classic PAT with
    # public_repo scope (fine-grained PATs cannot open PRs against upstream
    # microsoft/winget-pkgs; see tuna-os/bluefin-cli#110).
    skip_upload: '{{ if envOrDefault "WINGET_TOKEN" "" }}auto{{ else }}true{{ end }}'
    # Submissions to microsoft/winget-pkgs must come from a fork: goreleaser
    # pushes the manifest branch to the token owner's fork and opens the PR
    # against upstream (direct branch creation 403s — failed v0.8.0's pipe).
    repository:
      owner: hanthor
      name: winget-pkgs
      branch: "bluefin-cli-{{.Version}}"
      token: "{{ .Env.WINGET_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

# Chocolatey package for Windows users. Requires a CHOCOLATEY_API_KEY secret
# (API key for push to chocolatey.org community repository) and the `choco`
# binary on the runner — goreleaser shells out to it and does not install it.
# Unlike the other publishers, this pipe has no templated skip option, so the
# release workflow passes `--skip=chocolatey` when the key or `choco` is
# missing, keeping a release from failing on either.
chocolateys:
  - name: bluefin-cli
    ids:
      - standard
    project_url: "https://github.com/tuna-os/bluefin-cli"
    project_source_url: "https://github.com/tuna-os/bluefin-cli"
    docs_url: "https://github.com/tuna-os/bluefin-cli/blob/main/README.md"
    bug_tracker_url: "https://github.com/tuna-os/bluefin-cli/issues"
    title: "Bluefin CLI"
    authors: "TunaOS"
    owners: "TunaOS"
    summary: "Make your terminal experience awesome — shell config, tool bundles, and theming for any OS"
    description: |
      A powerful, modern CLI tool for managing shell configuration and
      development environment customization on Bluefin and Universal Blue.
    tags: "bluefin cli shell ublue universal-blue"
    release_notes: "https://github.com/tuna-os/bluefin-cli/releases/tag/{{.Tag}}"
    license_url: "https://github.com/tuna-os/bluefin-cli/blob/main/LICENSE"
    api_key: '{{ envOrDefault "CHOCOLATEY_API_KEY" "" }}'

